<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>中俣生誕祭2026</title>

    <link
        rel="stylesheet"
        href="css/birthday.css"
    >

</head>

<body>

    <div class="welcome">

        ★☆★☆★☆★☆★☆★☆★☆★☆★

        <marquee>
            🎉🎉🎉 中俣生誕祭2026 🎉🎉🎉
            お誕生日おめでとう！！！！
        </marquee>

        ★☆★☆★☆★☆★☆★☆★☆★☆★

    </div>


    <h1>
        🎂 HAPPY BIRTHDAY 🎂
    </h1>


    <div class="message">

        中俣さん！！<br>
        お誕生日おめでとう！！！

        <br><br>

        🎁 好きな画像をタップしてね！ 🎁

    </div>


    <!-- 画像4枚 -->

    <div id="photoGrid">

        <div class="photoCard">
            <img
                src="images/birthday1.jpg"
                alt="お祝い画像1"
                data-message="お誕生日おめでとう。この画像をともちゃんにおくってな"
            >
        </div>

        <div class="photoCard">
            <img
                src="images/birthday2.jpg"
                alt="お祝い画像2"
                data-message="お誕生日おめでとう。この画像をともちゃんにおくってな"
            >
        </div>

        <div class="photoCard">
            <img
                src="images/birthday3.jpg"
                alt="お祝い画像3"
                data-message="お誕生日おめでとう。この画像をともちゃんにおくってな"
            >
        </div>

        <div class="photoCard">
            <img
                src="images/birthday4.jpg"
                alt="お祝い画像4"
                data-message="お誕生日おめでとう。この画像をともちゃんにおくってな"
            >
        </div>

    </div>


    <!-- 画像拡大表示 -->

    <div id="photoModal">

        <div id="modalContent">

            <button id="modalClose">
                ×
            </button>

            <img
                id="modalImage"
                src=""
                alt="拡大画像"
            >

            <div id="modalMessage">
                お誕生日おめでとう。<br>
                この画像をともちゃんにおくってな
            </div>

        </div>

    </div>


    <script src="js/birthday.js"></script>

</body>

</html>
